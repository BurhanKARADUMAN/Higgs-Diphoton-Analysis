name: Higgs review / Python checks
on:
  push:
    paths:
      - 'higgs_review/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/higgs-review-ci.yml'
  pull_request:
    paths:
      - 'higgs_review/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/higgs-review-ci.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: higgs-review --mode demo --output examples/ci-demo
