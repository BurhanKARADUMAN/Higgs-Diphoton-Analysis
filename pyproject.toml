[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "higgs-diphoton-review"
version = "1.0.0"
description = "Transparent educational H->gamma gamma review toolkit and ROOT input utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
root = ["uproot>=5", "awkward>=2"]
test = ["pytest>=7", "scikit-learn>=1.3"]
ml = ["scikit-learn>=1.3"]

[project.scripts]
higgs-review = "higgs_review.cli:main"
higgs-bdt-check = "higgs_review.bdt_validation:main"

[tool.setuptools.packages.find]
include = ["higgs_review*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Install separately via `pip install -e '.[ml]'` for the optional BDT check.
